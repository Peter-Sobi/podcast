name: Apolut

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # stündlich

jobs:
  apolut:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 lxml

    - name: Prepare folders
      run: |
        mkdir -p media
        mkdir -p logs
        find media -name "*.part" -delete

    - name: Generate Apolut feed
      run: python3 generate-feed.py

    - name: Upload feed.xml
      uses: actions/upload-artifact@v4
      with:
        name: apolut-feed
        path: feed.xml

    - name: Upload media
      uses: actions/upload-artifact@v4
      with:
        name: apolut-media
        path: media

    - name: Commit & Push updated feed + media
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add feed.xml
        git add media

        if git diff --cached --quiet; then
          echo "Keine Änderungen – nichts zu committen."
        else
          git commit -m "Apolut-Update: neue Episoden automatisch hinzugefügt"
          git push
        fi

