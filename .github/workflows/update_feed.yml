name: Apolut Gesamtfeed

on:
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

jobs:
  apolut_all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Prepare folders
        run: |
          mkdir -p media_apolut_all
          mkdir -p logs
          find media_apolut_all -name "*.part" -delete

      - name: Run Apolut ALL feed generator
        run: |
          python3 generate-feed-apolut-all.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed_apolut_all.xml media_apolut_all logs/apolut_all.log || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Apolut Gesamtfeed"
            git push origin main --force-with-lease
          fi

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: apolut-all-log
          path: logs/apolut_all.log
          if-no-files-found: warn

