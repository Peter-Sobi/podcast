name: Apolut

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # stündlich

jobs:
  apolut:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 lxml

    - name: Prepare folders
      run: |
        mkdir -p media
        mkdir -p logs
        find media -name "*.part" -delete

    - name: Generate Apolut feed
      run: python3 generate-feed.py

    - name: Upload feed.xml
      uses: actions/upload-artifact@v4
      with:
        name: apolut-feed
        path: feed.xml

    - name: Upload media
      uses: actions/upload-artifact@v4
      with:
        name: apolut-media
        path: media

