name: AUF1 Apple Konverter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show workspace and find AUF1 scripts
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          echo "Top-level files:"
          ls -la
          echo "Find any auf1 python scripts (max 5):"
          find . -type f -iname "*auf1*.py" -maxdepth 5 -print | head -n 5 || true

      - name: Install system tools and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          pip install feedparser requests

      - name: Locate AUF1 script
        id: find_script
        run: |
          SCRIPT=$(find . -type f -iname "generate-*auf1*.py" -o -iname "*auf1*.py" -maxdepth 6 -print | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "No AUF1 script found. Listing candidate files:"
            find . -type f -iname "*auf1*.py" -maxdepth 6 -print
            exit 2
          fi
          echo "Found script: $SCRIPT"
          echo "script_path=$SCRIPT" >> $GITHUB_OUTPUT

      - name: Run AUF1 processing (download + convert)
        run: |
          echo "Running processing step with ${{ steps.find_script.outputs.script_path }}"
          python3 "${{ steps.find_script.outputs.script_path }}"

      - name: Delete old release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: auf1-latest
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auf1-latest
          name: AUF1 Latest
          body: "Automatisch generierte 32kbps Version"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "auf1_assets.txt" ]; then
            echo "ERROR: auf1_assets.txt not found. Make sure the converter script wrote it."
            exit 2
          fi
          while IFS="|" read -r file size; do
            if [ -f "$file" ]; then
              echo "Uploading: $file"
              gh release upload auf1-latest "$file" --clobber
            else
              echo "Warning: asset not found: $file"
            fi
          done < auf1_assets.txt

      - name: Fetch release asset URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/releases/tags/auf1-latest \
            --jq '.assets[] | "\(.name)|\(.browser_download_url)"' \
            > release_urls.txt
          echo "Release URLs written to release_urls.txt"
          cat release_urls.txt || true

      - name: Build final feed (uses release_urls.txt)
        run: |
          # If the script supports a build step, run it again; otherwise run the same script to build feed
          SCRIPT="${{ steps.find_script.outputs.script_path }}"
          if python3 "$SCRIPT" --help 2>&1 | grep -qi build; then
            python3 "$SCRIPT" build
          else
            python3 "$SCRIPT"
          fi

      - name: Commit and push feed_auf1.xml
        run: |
          if [ -f "feed_auf1.xml" ]; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add feed_auf1.xml release_urls.txt
            git commit -m "Update AUF1 feed" || echo "No changes to commit"
            git push || echo "Push failed (maybe read-only token)"
          else
            echo "feed_auf1.xml not found; skipping commit."
          fi

