name: AUF1 Feed Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install requests

      - name: Run AUF1 script
        run: python3 generate-feed-auf1.py

      - name: Delete old release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: auf1-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auf1-latest
          name: AUF1 Latest
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets
        run: |
          while IFS="|" read -r file size; do
            echo "Uploading $file"
            gh release upload auf1-latest "$file" --clobber
          done < auf1_assets.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch release asset URLs
        id: assets
        run: |
          gh api repos/peter-sobi/podcast/releases/tags/auf1-latest \
            --jq '.assets[] | "\(.name)|\(.browser_download_url)"' > release_urls.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build final feed
        run: |
          python3 << 'EOF'
import re

# Read release URLs
urls = {}
with open("release_urls.txt") as f:
    for line in f:
        name, url = line.strip().split("|")
        urls[name] = url

# Read asset sizes
sizes = {}
with open("auf1_assets.txt") as f:
    for line in f:
        file, size = line.strip().split("|")
        sizes[file.split("/")[-1]] = size

# Build feed
items = []
for name in urls:
    items.append(f"""
<item>
<title>{name}</title>
<link>https://auf1.radio</link>
<description><![CDATA[{name}]]></description>
<enclosure url="{urls[name]}" length="{sizes[name]}" type="audio/mpeg"/>
<guid isPermaLink="false">{urls[name]}</guid>
<pubDate>Mon, 01 Jan 2024 00:00:00 GMT</pubDate>
</item>
""")

rss = f"""<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0">
<channel>
<title>AUF1 Kombinierter Podcast</title>
<link>https://auf1.radio</link>
<description>Automatisch generierter Feed</description>
<language>de-de</language>
{''.join(items)}
</channel>
</rss>
"""

open("feed_auf1.xml", "w").write(rss)
EOF

      - name: Commit feed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add feed_auf1.xml
          git commit -m "Update AUF1 feed" || echo "No changes"
          git push

