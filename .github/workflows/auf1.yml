name: AUF1

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tools installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install feedparser requests charset-normalizer idna

      - name: Media-Ordner leeren (Refresh)
        run: |
          if [ -d "media_auf1" ]; then
            echo "Leere media_auf1 für vollständigen Refresh"
            rm -f media_auf1/*.mp3
          fi

      - name: AUF1 konvertieren + Feed bauen
        run: python3 generate-feed-auf1.py

      - name: Media-Ordner auf 20 Dateien begrenzen
        run: |
          if [ -d "media_auf1" ]; then
            echo "Begrenze media_auf1 auf 20 Dateien"
            cd media_auf1
            ls -1t *.mp3 | tail -n +21 | xargs -r rm --
            cd ..
          else
            echo "Media-Ordner nicht gefunden!"
          fi

      - name: Media-Ordner committen
        run: |
          if [ -d "media_auf1" ]; then
            echo "Committe media_auf1"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add media_auf1
            git commit -m "Refresh + Update media_auf1 (max 20 Dateien)" || echo "Keine Änderungen"
            git push
          else
            echo "Media-Ordner nicht gefunden!"
          fi

      - name: Feed committen
        run: |
          if [ -f "feed_auf1.xml" ]; then
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add feed_auf1.xml
            git commit -m "Refresh + Update AUF1 Feed" || echo "Keine Änderungen"
            git push
          else
            echo "FEHLER: feed_auf1.xml wurde nicht erzeugt!"
            exit 2
          fi

