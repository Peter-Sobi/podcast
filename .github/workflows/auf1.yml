name: Auf1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  auf1:
    name: Auf1
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        shell: bash

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests charset-normalizer idna
        shell: bash

      - name: Prepare media folder
        run: |
          mkdir -p media_auf1
          # remove partial files only; keep existing final MP3s
          find media_auf1 -type f -name "*.part" -print -delete || true
        shell: bash

      - name: AUF1 konvertieren + Feed bauen
        run: |
          # Für Testlauf seriell; für schnellere Produktion auf 2 oder 3 ändern
          python3 generate-feed-auf1.py 1
        shell: bash
        env:
          REQUEST_TIMEOUT: 12

      - name: Upload feed and logs
        uses: actions/upload-artifact@v4
        with:
          name: auf1-artifacts
          path: |
            feed_auf1.xml
            logs/auf1.log

      - name: Upload media files (optional)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: media-files
          path: media_auf1
          retention-days: 7
